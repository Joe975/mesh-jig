name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "showcase/reference-*/**", "showcase/explore-*/**", "tools/build_publish_history.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble the page and the showcases it shows
        run: |
          mkdir -p _site/showcase
          cp -r site/. _site/
          cp -r showcase/reference-* showcase/explore-* _site/showcase/
          python3 -m venv .venv
          .venv/bin/python tools/build_publish_history.py --repo "$GITHUB_WORKSPACE" --page "$GITHUB_WORKSPACE/_site/index.html"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
